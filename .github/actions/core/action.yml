name: A Parachute hub for the tests
description: >-
  Installs parachute-core and sets PARACHUTE_CORE. `core` is an npm version of @openparachute/core (0.8.0,
  0.9.0-pre.2) or a git ref of ParachuteComputer/parachute-core (next, a commit), built from source: CI needn't wait
  for a release to test against core's next.
inputs:
  core:
    description: an npm version, or a branch or commit of parachute-core
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - name: Install parachute-core ${{ inputs.core }}
      shell: bash
      env:
        CORE: ${{ inputs.core }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/hub"
        rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
        if [[ "$CORE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo '{"name":"e2e-hub","private":true}' > package.json
          bun add "@openparachute/core@$CORE"
          bin="$dir/node_modules/.bin/parachute-core"
          echo "core: npm @openparachute/core@$CORE" >> "$GITHUB_STEP_SUMMARY"
        else
          git init -q && git fetch -q --depth 1 https://github.com/ParachuteComputer/parachute-core.git "$CORE" && git checkout -q FETCH_HEAD
          bun install --frozen-lockfile   # its prepare script builds the packages
          bin="$dir/packages/cli/bin/parachute-core"
          echo "core: parachute-core $CORE at $(git rev-parse --short HEAD) ($(git log -1 --format=%s | cut -c1-80))" >> "$GITHUB_STEP_SUMMARY"
        fi
        "$bin" --version
        echo "PARACHUTE_CORE=$bin" >> "$GITHUB_ENV"
