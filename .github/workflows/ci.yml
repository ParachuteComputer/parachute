name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [next, main]

jobs:
  web:
    # the hub before the record door (0.8) and with it (0.9, npm beta): the app must work on both (src/vault/records.ts).
    # 0.9.0-pre.2 is the first release with typed keys, sharing and the one list (core #140 #141 #144), so on that leg
    # their specs must run: E2E_CORE_NEXT turns their skip into a failure. When the app needs core before a release has
    # it, a leg may name a core commit instead (built from source, .github/actions/core): move it on purpose, in the PR
    # that needs it, and the shell job's second leg with it. The Services workflow follows core's next as it moves.
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.8.0"
          - core: "0.9.0-pre.2"
            next: "1"
    name: web (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    # (about 25 min: the specs in Chromium, then the applet frame in WebKit)
    timeout-minutes: 40
    env:
      E2E_CORE_NEXT: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Push gateway (services/push-gateway)
        run: cd services/push-gateway && npm ci && npm run typecheck && npm test
      - name: People CardDAV bridge (services/carddav)
        run: cd services/carddav && npm ci && npm run typecheck && npm test
      # the app's bundle has no test signer (src/services/e2eNative.ts); the e2e build below has one
      - name: No test signer in the app's bundle
        run: npm run build && scripts/no-test-signer.sh dist
      # The end-to-end tests run the web build against a real hub: parachute-core, in a throwaway home, on loopback.
      - uses: ./.github/actions/core
        with:
          core: ${{ matrix.core }}
      # the bridge needs the record door and person-scoped tokens: core 0.9 (0.9.0-pre.1 is what Aaron's hub runs) and next
      - name: People CardDAV bridge end to end (a real hub, DAVx5's requests)
        if: matrix.core != '0.8.0'
        run: cd services/carddav && npm run e2e
      # Chromium (Android's webview) for the specs, WebKit (the Mac app's WKWebView) for e2e/webkit.spec.ts
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (Playwright, web build)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.core }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  applet-host:
    # Parachute applets as an MCP App (packages/applet-host, T-476): the view built from this branch, served by core's
    # vault door (a core commit with the MCP App surface, built from source; move it on purpose), driven in the MCP Apps
    # reference host (ext-apps basic-host, a pinned commit): approved applets as tiles, People and Library sealed in the
    # app's frame inside the view, a write, and an approved applet that tries every way out. Chromium, Chromium under
    # the spec's default content policy, and WebKit (Safari's engine) under it.
    name: applet-host (MCP Apps reference host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the view (one HTML file)
        run: npx vite build --config packages/applet-host/vite.config.ts && ls -l packages/applet-host/dist
      - uses: ./.github/actions/core
        with:
          core: bc2e4cbbfd96d0b8dbc2b55fed486e65c8d0b516   # core next with #170 (the MCP App); move to a release when one carries it
      - name: The reference host (ext-apps basic-host, pinned)
        run: packages/applet-host/e2e/basic-host.sh "$RUNNER_TEMP/ext-apps" 47393
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Applets in the reference host (Chromium)
        run: node packages/applet-host/e2e/run.mjs "$RUNNER_TEMP/shots"
        env: { EXT_APPS: "${{ runner.temp }}/ext-apps", APPLET_HOST_HTML: "${{ github.workspace }}/packages/applet-host/dist/applet-host.html" }
      - name: The same under the spec's default content policy (Chromium)
        run: node packages/applet-host/e2e/run.mjs --strict
        env: { EXT_APPS: "${{ runner.temp }}/ext-apps", APPLET_HOST_HTML: "${{ github.workspace }}/packages/applet-host/dist/applet-host.html" }
      - name: The same under it in WebKit
        run: node packages/applet-host/e2e/run.mjs --strict --browser webkit
        env: { EXT_APPS: "${{ runner.temp }}/ext-apps", APPLET_HOST_HTML: "${{ github.workspace }}/packages/applet-host/dist/applet-host.html" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applet-host-shots
          path: ${{ runner.temp }}/shots

  shell:
    # the released hub people run (0.8), and the web job's 0.9 leg, where sharing must run (E2E_CORE_NEXT), not skip
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.8.0"
          - core: "0.9.0-pre.2"
            next: "1"
    name: shell (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Linux webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The key door and sharing tests (src-tauri/tests/door_hub.rs, sharing_hub.rs) sign in to a real hub, as the web
      # tests do.
      - uses: ./.github/actions/core
        with:
          core: ${{ matrix.core }}
      - name: Shell tests
        env:
          E2E_CORE_NEXT: ${{ matrix.next }}
        run: |
          mkdir -p dist && echo '<!doctype html>' > dist/index.html
          cargo test --locked --manifest-path src-tauri/Cargo.toml
