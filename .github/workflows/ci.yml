name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [next, main]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # The end-to-end tests run the web build against a real hub: parachute-core, in a throwaway home, on loopback.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install a Parachute hub for the tests
        run: |
          mkdir -p "$RUNNER_TEMP/hub" && cd "$RUNNER_TEMP/hub"
          echo '{"name":"e2e-hub","private":true}' > package.json
          bun add @openparachute/core@0.8.0
          echo "PARACHUTE_CORE=$RUNNER_TEMP/hub/node_modules/.bin/parachute-core" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, web build)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Linux webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Shell tests
        run: |
          mkdir -p dist && echo '<!doctype html>' > dist/index.html
          cargo test --locked --manifest-path src-tauri/Cargo.toml
