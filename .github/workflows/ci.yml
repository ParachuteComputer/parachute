name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [next, main]

jobs:
  web:
    # the hub before the record door (0.8) and with it (0.9): the app must work on both (src/vault/records.ts); and
    # core's next at a commit (built from source, .github/actions/core), for what the app needs before a release has it:
    # move it on purpose, in the PR that needs it (the shell job's second leg pins the same). There the specs for what that
    # core has (who reaches a vault, sharing, the one list) must run: E2E_CORE_NEXT turns their skip into a failure.
    # The Services workflow follows core's next as it moves.
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.8.0"
          - core: "0.9.0-pre.1"
          - core: "b1d2da57a086bf04bfd7d7812cc377a790d393ed"
            next: "1"
    name: web (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_CORE_NEXT: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Push gateway (services/push-gateway)
        run: cd services/push-gateway && npm ci && npm run typecheck && npm test
      # the app's bundle has no test signer (src/services/e2eNative.ts); the e2e build below has one
      - name: No test signer in the app's bundle
        run: npm run build && scripts/no-test-signer.sh dist
      # The end-to-end tests run the web build against a real hub: parachute-core, in a throwaway home, on loopback.
      - uses: ./.github/actions/core
        with:
          core: ${{ matrix.core }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, web build)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.core }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  shell:
    # the released hub people run (0.8), and core's next at the web job's pinned commit, where sharing must run
    # (E2E_CORE_NEXT), not skip
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.8.0"
          - core: "b1d2da57a086bf04bfd7d7812cc377a790d393ed"
            next: "1"
    name: shell (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Linux webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The key door and sharing tests (src-tauri/tests/door_hub.rs, sharing_hub.rs) sign in to a real hub, as the web
      # tests do.
      - uses: ./.github/actions/core
        with:
          core: ${{ matrix.core }}
      - name: Shell tests
        env:
          E2E_CORE_NEXT: ${{ matrix.next }}
        run: |
          mkdir -p dist && echo '<!doctype html>' > dist/index.html
          cargo test --locked --manifest-path src-tauri/Cargo.toml
