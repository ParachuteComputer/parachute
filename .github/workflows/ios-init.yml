name: iOS init (temporary, T-520)
permissions:
  contents: read
on:
  push:
    branches: [ios-t520]
jobs:
  init:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: brew install xcodegen || true
      - run: xcodebuild -version; xcodegen --version
      - run: npx tauri ios init --ci
      - run: find src-tauri/gen/apple -type f | head -200
      - uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          path: src-tauri/gen/apple
          include-hidden-files: true
