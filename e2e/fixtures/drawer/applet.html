<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Recipes</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 16px; color: var(--text, #111); background: var(--surface, #fff); }
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #ddd; background: none; padding: 10px 2px; }
</style></head>
<body>
<!-- A drawer applet written the way the Uni app's are (uni-ops applets, contract 2, window.uni, HTML, no kit parts): the
     same controls and the same vault calls as the Recipes applet there (queryNotes, getNote, createNote, updateNote with
     if_updated_at, ready), so e2e/drawer.spec.ts drives this one in CI and the real one with UNI_APPLET_DIR. -->
<main>
  <section aria-label="All recipes"><h1>Recipes</h1><ul id="rows"></ul><button type="button" id="add">Add a recipe</button></section>
  <section id="page" aria-live="polite"></section>
</main>
<script>
const FOLDER = "Recipes/";
const $ = (id) => document.getElementById(id);
const leaf = (p) => p.slice(FOLDER.length);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
let open = null;
function el(tag, attrs, text) { const e = document.createElement(tag); Object.assign(e, attrs || {}); if (text != null) e.textContent = text; return e; }
async function list() {
  const rows = await uni.vault.queryNotes({ pathPrefix: FOLDER, limit: 50 });
  $("rows").replaceChildren(...rows.filter((n) => n.path.startsWith(FOLDER)).map((n) => {
    const b = el("button", { type: "button", className: "row" }, leaf(n.path));
    b.addEventListener("click", () => read(n.id));
    return el("li", {}, null).appendChild(b).parentNode;
  }));
}
async function read(id) {
  open = await uni.vault.getNote(id);
  const made = el("button", { type: "button", id: "made" }, open.content.includes(`- ${today()}`) ? "Made today" : "We made this today");
  made.disabled = made.textContent === "Made today";
  made.addEventListener("click", async () => {
    const content = `${open.content.replace(/\n+$/, "")}\n\n## Made\n- ${today()}\n`;
    open = await uni.vault.updateNote(open.id, { content, if_updated_at: open.updatedAt });
    made.textContent = "Made today"; made.disabled = true;
  });
  $("page").replaceChildren(el("h2", {}, leaf(open.path)), el("pre", {}, open.content), made);
}
$("add").addEventListener("click", () => {
  const title = el("input", { id: "f-title", placeholder: "What is it called?" });
  const ingredients = el("textarea", { id: "f-ingredients", placeholder: "One per line" });
  const save = el("button", { type: "button", id: "save" }, "Add to the book");
  save.addEventListener("click", async () => {
    const name = title.value.trim();
    const lines = ingredients.value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => `- ${l}`).join("\n");
    await uni.vault.createNote({ path: FOLDER + name, content: `# ${name}\n\n## Ingredients\n${lines}\n` });
    await list();
    $("page").replaceChildren(el("p", {}, `Added ${name}.`));
  });
  $("page").replaceChildren(el("h2", {}, "A new recipe"), title, ingredients, save);
});
uni.ready().then(list);
</script>
</body>
</html>
