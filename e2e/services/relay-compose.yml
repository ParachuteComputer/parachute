# A throwaway Buzz relay for the local services tests (e2e/services/README.md). Loopback only.
# Mirrors production's auth flags: relay membership, auth tokens, media read auth.
name: parachute-e2e-relay
x-labels: &labels
  owner: parachute-e2e
  purpose: throwaway-test
services:
  postgres:
    image: postgres:17-alpine
    container_name: parachute-e2e-relay-pg
    labels: *labels
    environment: { POSTGRES_USER: buzz, POSTGRES_PASSWORD: buzz_test, POSTGRES_DB: buzz }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U buzz"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    container_name: parachute-e2e-relay-redis
    labels: *labels
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: parachute-e2e-relay-minio
    labels: *labels
    command: server /data
    environment: { MINIO_ROOT_USER: buzz_test, MINIO_ROOT_PASSWORD: buzz_test_secret }
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: parachute-e2e-relay-minio-init
    labels: *labels
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "sleep 4; mc alias set l http://minio:9000 buzz_test buzz_test_secret && mc mb --ignore-existing l/buzz-media"]
    restart: "no"
  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    container_name: parachute-e2e-relay
    labels: *labels
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3871:3000"]
    env_file: [${BUZZ_ENV_FILE:?a file with RELAY_OWNER_PUBKEY and BUZZ_RELAY_PRIVATE_KEY}]
    environment:
      DATABASE_URL: postgres://buzz:buzz_test@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: buzz_test
      BUZZ_S3_SECRET_KEY: buzz_test_secret
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_S3_REGION: us-east-1
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      RELAY_URL: ws://localhost:3871
      BUZZ_MEDIA_BASE_URL: http://localhost:3871/media
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_MEDIA_GET_AUTH: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      RUST_LOG: buzz_relay=info
