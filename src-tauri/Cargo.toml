[package]
name = "parachute"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
description = "Parachute: the shell around the app (Tauri 2)"

# Mobile needs the app as a library; main.rs stays the desktop entry point.
[lib]
name = "parachute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Pinned to the Tauri and wry versions the Android webview overrides (gen/android/.../RustWebView.kt, Ipc.kt) were
# derived from: wry 0.55.1 under Tauri 2.11. build.rs refuses an Android build on any other wry.
tauri = { version = "=2.11.6", features = [] }
tauri-runtime-wry = "=2.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-opener = "=2.5.5"
# Links in: parachute://open?url=… (Android intent filter and desktop scheme from tauri.conf.json).
tauri-plugin-deep-link = "=2.4.5"
# The person's Nostr key, kept here in the shell and never handed to the web side. Pairing is NIP-AB, the protocol the
# Uni app and Buzz desktop send a key with: buzz-core holds its crypto, buzz-ws-client its relay I/O (public, Apache-2.0).
buzz-core = { git = "https://github.com/unforcedagi/buzz.git", rev = "5669fdcbc13aa85b0edede555478ae11b6771e0a" }
buzz-ws-client = { git = "https://github.com/unforcedagi/buzz.git", rev = "5669fdcbc13aa85b0edede555478ae11b6771e0a" }
# The same nostr major buzz pins, so its types are ours. nip44 seals an applet's private notes and its service tokens
# (services.rs).
nostr = { version = "0.44", default-features = false, features = ["std", "nip44", "nip98"] }
zeroize = "1.8"
tokio = { version = "1", features = ["time", "sync"] }
url = "2"
# An upload's body, shared (not copied) between the broker's two tries (services.rs).
bytes = "1"
# The hub's key door (two requests). rustls with ring, installed at start (the release build aborts on a panic).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
# The update's file, checked against the feed's sum as it downloads (updates.rs); the version already in the lockfile.
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktop keeps the key in the OS keyring; Android in the Keystore (gen/android/.../KeyPlugin.kt).
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "android")'.dependencies]
# NotifyService.kt calls into Rust for one signature, the relay's sign-in (notify.rs). The version tauri and wry use.
jni = "0.21.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Scanning the pairing QR code another device shows (the Uni app does the same).
tauri-plugin-barcode-scanner = "=2.4.6"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# A native OK/Cancel before an approval where there is no device unlock to ask (keyring.rs), as the Uni app. Called
# from Rust only; the web side has no permission for it.
tauri-plugin-dialog = "=2.7.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Same major as the webkit2gtk wry links; used only to switch WebRTC off and take the bridge away for sealed applets.
webkit2gtk = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
# The device unlock before an approval (keyring.rs), as the Uni app asks it.
objc2-local-authentication = "0.3"
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKPreferences"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
# The Buzz pairing relay itself, run in-process for the pairing test (tests/pairing.rs).
buzz-pair-relay = { git = "https://github.com/unforcedagi/buzz.git", rev = "5669fdcbc13aa85b0edede555478ae11b6771e0a" }
