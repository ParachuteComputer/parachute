<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts, mockup B: Herbarium</title>
<style>
/* B, "Herbarium": pressed sheets laid on a table. Soft paper panels with a faint deckle shadow, rounded; a clay accent
   beside the moss; roomier. */
:root {
  --bg: #ebe4d4; --surface: #faf6ec; --text: #2a241c; --muted: #7a6e5c; --line: #e2d8c4; --accent: #9a5b34; --danger: #9a3324;
  --serif: "Iowan Old Style", Palatino, "Noto Serif", Georgia, serif; --sans: system-ui, "Noto Sans", sans-serif; --mono: ui-monospace, monospace;
  --pad: 20px; --gap: 18px; --radius: 14px; --size: 16px; --leading: 1.55;
}
:root.alt { --bg: #e3e7dc; --surface: #f6f8f1; --text: #1f2a22; --muted: #5f6f60; --line: #d3dccd; --accent: #4f6b3a; --radius: 6px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--size)/var(--leading) var(--sans); }
body { display: flex; flex-direction: column; }
.shell-top { display: flex; align-items: center; gap: 10px; padding: 12px var(--pad); font: 600 20px var(--serif); }
.shell-top .more { margin-left: auto; color: var(--muted); } .shell-top .back { font-size: 26px; } .glyph { color: var(--accent); font-weight: 400; }
.shell-bar { display: flex; justify-content: center; gap: 12px; padding: 10px; background: var(--bg); font-size: 14px; }
.shell-bar a { display: grid; justify-items: center; padding: 4px 18px; border-radius: 999px; color: var(--muted); } .shell-bar a.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 0 var(--line); }
.sheet { flex: 1; overflow: hidden; display: grid; gap: var(--gap); padding: 0 var(--pad) var(--gap); max-width: 1500px; width: 100%; margin: 0 auto; }
@media (min-width: 900px) { .sheet { grid-template-columns: 1fr 1fr; padding: 16px 48px; gap: 32px; } .sheet.two { grid-template-columns: 2fr 3fr; } }
@media (max-width: 899px) { .wide-only { display: none; } .sheet { overflow: auto; } }
.kicker { margin: var(--gap) 0 6px 4px; font: 600 12px var(--sans); color: var(--accent); }
.page-title { margin: 6px 0 0; font: 600 34px/1.1 var(--serif); } .page-sub { margin: 2px 0 var(--gap); color: var(--muted); }

/* ── the parts ── */
.pa-note { padding: 26px 30px; background: var(--surface); border-radius: var(--radius); box-shadow: 0 1px 0 var(--line), 0 6px 18px -12px rgba(60,40,10,.35); font: 17px/1.65 var(--serif); }
.pa-note h1 { margin: 0 0 4px; font: 600 32px/1.15 var(--serif); }
.pa-note .pa-lede { margin: 0 0 var(--gap); color: var(--muted); }
.pa-note h2 { margin: calc(var(--gap) * 1.2) 0 4px; font: 600 18px var(--serif); color: var(--accent); }
.pa-note ul, .pa-note ol { margin: 0; padding-left: 1.3em; } .pa-note li::marker { color: var(--accent); }
.pa-note a { color: var(--accent); }
.pa-note blockquote { margin: var(--gap) 0 0; padding: 12px 16px; border-radius: calc(var(--radius) / 2); background: var(--bg); color: var(--muted); }

.pa-list { margin: 0 0 var(--gap); } .pa-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pa-list-label { margin: 0 0 6px 4px; font: 600 15px var(--serif); color: var(--muted); }
.pa-row { display: grid; grid-template-columns: 1fr auto; width: 100%; padding: 12px 16px; border: 0; border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 0 var(--line); color: inherit; font: inherit; text-align: left; }
.pa-row-title { font: 600 18px/1.3 var(--serif); } .pa-row-meta { grid-column: 1; font-size: 13px; color: var(--muted); }
.pa-row-aside { grid-row: 1; grid-column: 2; font-size: 13px; color: var(--accent); }

.pa-card { margin: 0 0 var(--gap); padding: 16px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 0 var(--line), 0 6px 18px -12px rgba(60,40,10,.35); }
.pa-card-title { margin: 0 0 4px; font: 600 18px var(--serif); } .pa-card p { margin: 0; color: var(--muted); }

.pa-field { display: grid; gap: 4px; margin: 0 0 var(--gap); } .pa-field-label { margin-left: 4px; font: 600 13px var(--sans); color: var(--muted); }
.pa-field-row { display: flex; gap: 8px; }
.pa-field input { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font: 17px var(--serif); color: var(--text); outline: none; }
.pa-field-action { padding: 0 20px; border: 0; border-radius: var(--radius); background: var(--accent); font: 600 15px var(--sans); color: var(--surface); }

.pa-empty { display: grid; justify-items: center; gap: 8px; padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
.pa-empty p { margin: 0; font: 16px var(--serif); }
.pa-empty-mark { width: 34px; height: 34px; border-radius: 50% 0; border: 1.5px solid var(--accent); transform: rotate(45deg); }
</style></head>
<body><script src="mock.js"></script></body></html>
