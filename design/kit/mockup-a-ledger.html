<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts, mockup A: Ledger</title>
<style>
/* A, "Ledger": the page of a well-kept book. Paper, ink, hairline rules; nothing sits in a box. One moss accent. */
:root {
  --bg: #f2ede2; --surface: #f7f3ea; --text: #1d1a16; --muted: #6d665a; --line: #d6cdbb; --accent: #4f6b3a; --danger: #9a3324;
  --serif: "Iowan Old Style", Palatino, "Noto Serif", Georgia, serif; --sans: system-ui, "Noto Sans", sans-serif; --mono: ui-monospace, monospace;
  --pad: 16px; --gap: 14px; --radius: 4px; --size: 16px; --leading: 1.5;
}
:root.alt { --bg: #eceee9; --surface: #f4f5f1; --text: #1b1f22; --muted: #5e666b; --line: #c9cfcc; --accent: #2f5470; --serif: "Noto Serif", Georgia, serif; --gap: 20px; --pad: 22px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--size)/var(--leading) var(--sans); }
body { display: flex; flex-direction: column; }
.shell-top { display: flex; align-items: center; gap: 10px; padding: 10px var(--pad); border-bottom: 1px solid var(--line); font: 600 20px var(--serif); }
.shell-top .more { margin-left: auto; color: var(--muted); } .shell-top .back { font-size: 26px; } .glyph { color: var(--muted); font-weight: 400; }
.shell-bar { display: flex; justify-content: center; gap: 36px; padding: 8px; border-top: 1px solid var(--text); background: var(--bg); font-size: 14px; }
.shell-bar a { display: grid; justify-items: center; color: var(--muted); } .shell-bar a.on { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--text); }
.sheet { flex: 1; overflow: hidden; display: grid; gap: calc(var(--gap) * 3); padding: var(--gap) var(--pad); max-width: 1500px; width: 100%; margin: 0 auto; }
@media (min-width: 900px) { .sheet { grid-template-columns: 1fr 1fr; padding: 28px 56px; } .sheet.two { grid-template-columns: 2fr 3fr; } }
@media (max-width: 899px) { .wide-only { display: none; } .sheet { overflow: auto; } }
.kicker { margin: var(--gap) 0 6px; font: 600 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.page-title { margin: 6px 0 0; font: 400 40px/1.1 var(--serif); } .page-sub { margin: 2px 0 var(--gap); font: italic 16px var(--serif); color: var(--muted); }

/* ── the parts ── */
.pa-note { font: 18px/1.6 var(--serif); }
.pa-note h1 { margin: 0 0 4px; font: 400 38px/1.1 var(--serif); }
.pa-note .pa-lede { margin: 0 0 var(--gap); font-style: italic; color: var(--muted); }
.pa-note h2 { margin: calc(var(--gap) * 1.4) 0 4px; font: 600 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pa-note ul, .pa-note ol { margin: 0; padding-left: 1.3em; } .pa-note li { padding: 1px 0; }
.pa-note a { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.pa-note blockquote { margin: var(--gap) 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--text); font-style: italic; color: var(--muted); }

.pa-list { margin: 0 0 var(--gap); } .pa-list ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--text); }
.pa-list-label { margin: 0 0 4px; font: italic 400 16px var(--serif); color: var(--muted); }
.pa-row { display: grid; grid-template-columns: 1fr auto; width: 100%; padding: calc(var(--gap) * .55) 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; }
.pa-row-title { font: 500 19px/1.3 var(--serif); } .pa-row-meta { grid-column: 1; font-size: 13px; color: var(--muted); }
.pa-row-aside { grid-row: 1; grid-column: 2; font: italic 14px var(--serif); color: var(--muted); }

.pa-card { margin: 0 0 var(--gap); padding: 10px 0 12px 16px; border-left: 2px solid var(--accent); }
.pa-card-title { margin: 0 0 2px; font: 600 17px var(--serif); } .pa-card p { margin: 0; color: var(--muted); }

.pa-field { display: grid; gap: 2px; margin: 0 0 var(--gap); } .pa-field-label { font: italic 15px var(--serif); color: var(--muted); }
.pa-field-row { display: flex; align-items: end; gap: 12px; }
.pa-field input { flex: 1; padding: 6px 0; border: 0; border-bottom: 1px solid var(--text); background: none; font: 19px var(--serif); color: var(--text); outline: none; }
.pa-field-action { padding: 6px 14px; border: 1px solid var(--text); border-radius: 999px; background: none; font: 600 14px var(--sans); color: var(--text); }

.pa-empty { display: flex; gap: 12px; align-items: center; padding: var(--gap) 0; color: var(--muted); font: italic 17px var(--serif); }
.pa-empty p { margin: 0; } .pa-empty-mark { width: 28px; height: 0; border-top: 1px solid var(--muted); }
</style></head>
<body><script src="mock.js"></script></body></html>
