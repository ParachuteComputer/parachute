<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: your apps, and one app's settings</title>
<!-- docs/design/APP-RECORD.md. Static; made-up names and hosts. ?screen=picker | settings | allowed -->
<style>
  :root { --bg: #f2ede2; --surface: #fbf8f1; --text: #1d1a16; --muted: #6d665a; --line: #d9d1c1; --accent: #4f6b3a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Noto Serif", Georgia, serif; --sans: system-ui, "Noto Sans", sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--sans); display: flex; flex-direction: column; }
  header { padding: 18px 20px 6px; }
  h1 { margin: 0; font: 600 30px/1.1 var(--serif); }
  h1 small { font: italic 15px var(--serif); color: var(--muted); margin-left: 8px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  main { flex: 1; padding: 4px 20px 0; overflow: hidden; }
  h2 { margin: 14px 0 0; padding-bottom: 4px; border-bottom: 1.5px solid var(--text); font: italic 17px var(--serif); color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
  h2 a { font: 13.5px var(--sans); color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .row { display: grid; grid-template-columns: 30px 1fr auto; gap: 0 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row .g { font-size: 19px; text-align: center; filter: grayscale(1); }
  .row b { font: 600 17px/1.2 var(--serif); }
  .row p { margin: 1px 0 0; font: italic 13.5px/1.3 var(--serif); color: var(--muted); grid-column: 2 / 4; }
  .row .end { font-size: 13.5px; color: var(--muted); white-space: nowrap; }
  .app { grid-template-columns: 40px 1fr auto; padding: 12px 0; }
  .app .g { font-size: 26px; }
  .app b { font-size: 22px; }
  .app p { font-size: 14.5px; }
  .here { font: 600 11.5px var(--sans); background: var(--text); color: var(--bg); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 3px; }
  .dot { display: inline-block; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font: 600 12.5px/20px var(--sans); text-align: center; }
  .pick { font: 600 13px var(--sans); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 9px; white-space: nowrap; }
  .pick.on { border-color: var(--accent); color: var(--accent); }
  .offer { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
  .offer button, .add { font: 600 14px var(--sans); border-radius: 9px; padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .add { display: inline-block; margin-top: 12px; background: none; color: var(--text); border-color: var(--line); }
  .fine { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .tight header { padding: 14px 20px 0; } .tight h1 { font-size: 26px; } .tight h2 { margin-top: 9px; font-size: 16px; } .tight .row { padding: 5px 0; } .tight .row b { font-size: 16.5px; } .tight .row p { font-size: 13px; } .tight .fine { font-size: 12.5px; margin-top: 5px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 4px; } .actions button { font: 600 15px var(--sans); border-radius: 10px; padding: 9px 16px; border: 1px solid var(--line); background: var(--bg); color: var(--text); } .actions .primary { background: var(--accent); color: #fff; border-color: var(--accent); } .row p b { font-style: normal; font-family: var(--sans); font-size: 12.5px; color: var(--text); }
  nav { display: flex; border-top: 1.5px solid var(--text); background: var(--surface); padding: 8px 6px 10px; }
  nav div { flex: 1; text-align: center; font-size: 12.5px; position: relative; }
  nav div span { display: block; font-size: 19px; line-height: 1.25; filter: grayscale(1); }
  nav div:first-child { border-right: 1px solid var(--line); font-weight: 650; }
  nav .dot { position: absolute; top: -3px; left: 50%; margin-left: 6px; min-width: 17px; height: 17px; line-height: 17px; font-size: 11px; padding: 0 4px; }
</style>
</head>
<body>
<script>
const screen = new URLSearchParams(location.search).get("screen") || "picker";
const BAR = `<nav><div><span>⁂</span>Launcher</div><div><span>⌒</span>Home</div><div><span>✎</span>Journal</div><div><span>✉</span>Mail<i class="dot" style="font-style:normal">2</i></div><div><span>◎</span>Rooms<i class="dot" style="font-style:normal">3</i></div><div><span>◷</span>Events</div></nav>`;
const row = (g, name, line, end = "") => `<div class="row"><span class="g">${g}</span><b>${name}</b><span class="end">${end}</span><p>${line}</p></div>`;
if (screen === "picker") document.body.innerHTML = `
<header><h1>Your apps <small>on this phone</small></h1></header>
<main>
  <h2>In your vault home <a>New app</a></h2>
  <div class="row app"><span class="g">◉</span><b>Uni <span class="here">open here</span></b><span class="end"><i class="dot" style="font-style:normal">5</i></span>
    <p>everyday: journal, mail, rooms</p><p>Everything in home · Seed log from garden · Events from Techne</p></div>
  <div class="row app"><span class="g">△</span><b>Techne</b><span class="end">Settings ›</span>
    <p>events, members, the shop floor</p><p>Everything in techne · someone else's, at techne.example</p></div>
  <div class="row app"><span class="g">❖</span><b>Everything</b><span class="end">Settings ›</span>
    <p>every applet in every vault of your 2 Parachutes</p><p>How the app worked until now</p></div>
  <div class="offer"><span><b>Techne changed its app</b> since you added yours: one applet more. Yours stays as it is until you take the change.</span><button>See</button></div>
  <p class="fine">Tap an app to open it here. Your other devices keep their own choice; a new one opens Uni.</p>
</main>${BAR}`;
else if (screen === "allowed") { document.body.className = "tight"; document.body.innerHTML = `
<header><h1>Allowed elsewhere</h1><p class="sub">You allowed these on your Pixel and your laptop. The list is signed by your key, so nobody else could have added to it.</p></header>
<main>
  <h2>Bring to this phone</h2>
  ${row("✎", "Journal", "reads, adds and changes notes in Journal/", "laptop, 2 Nov")}
  ${row("✉", "Mail", "as you on mail.example: reads and sends your mail", "Pixel, 9 Nov")}
  ${row("✿", "Seed log", "reads and adds notes in Garden/Seeds/", "laptop, 5 Nov")}
  ${row("⌒", "Home", "the newest titles in every vault, your bar", "Pixel, 9 Nov")}
  ${row("☑", "Tasks", "reads and changes notes in Tasks/", "Pixel, 12 Nov")}
  <div class="actions"><button>Not now</button><button class="primary">Allow these 5 here</button></div>
  <h2>These ask one at a time</h2>
  ${row("◎", "Rooms", "<b>High risk:</b> answers approval cards with your approval key", "Its card ›")}
  ${row("◷", "Events", "<b>Someone else's vault:</b> techne, at techne.example", "Its card ›")}
  <p class="fine">Asked here when first used: the microphone, notifications, your device unlock.</p>
</main>${BAR}`; }
else { document.body.className = "tight"; document.body.innerHTML = `
<header><h1>‹ Uni <small>an app, kept in your vault home</small></h1></header>
<main>
  <h2>Applets from <a>Add</a></h2>
  ${row("✳", "Everything in home", "9 applets, 1 hidden · new ones ask first", "›")}
  ${row("✿", "Seed log", "one applet, from your vault garden", "›")}
  ${row("◷", "Events", "one applet, from techne · someone else's", "›")}
  <h2>On the bar <a>Change</a></h2>
  <div class="row" style="grid-template-columns:1fr"><span style="font:15.5px var(--serif)">⌒ Home <i style="color:var(--muted);font-size:13px">on start</i> · ✎ Journal · ✉ Mail · ◎ Rooms · ◷ Events</span></div>
  <h2>Something for you</h2>
  ${row("◎", "Rooms", "mentions and messages from Uni", `<span class="pick on">Notify + badge</span>`)}
  ${row("✉", "Mail", "unread mail", `<span class="pick">Badge</span>`)}
  ${row("◷", "Events", "new events at Techne", `<span class="pick">Off</span>`)}
  <h2>Running, allowed, the rest</h2>
  ${row("↻", "Kept running: auto", "up to 6 here · drafts are kept either way", "›")}
  ${row("✓", "7 applets allowed", "signed by your key · each device says yes once", "›")}
  ${row("⋯", "More", "hidden applets, what opens what, theme, servers", "›")}
</main>${BAR}`; }
</script>
</body>
</html>
