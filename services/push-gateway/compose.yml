# The push gateway on one box, published on loopback only: put a TLS proxy (Caddy, a Cloudflare Tunnel, tailscale
# serve) in front and set PUSH_GATEWAY_URL to the address people's phones reach. README.md.
name: parachute-push-gateway

services:
  gateway:
    build: .
    container_name: parachute-push-gateway
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8790:8790"]
    environment:
      PUSH_GATEWAY_URL: ${PUSH_GATEWAY_URL:?its public address, ending in /}
      PUSH_GATEWAY_RELAYS: ${PUSH_GATEWAY_RELAYS:?the relays it watches, comma-separated}
      PUSH_GATEWAY_KEY_FILE: /run/secrets/gateway-key
      # 1 when your TLS proxy appends the client to X-Forwarded-For: new registrations are limited per client address
      PUSH_GATEWAY_TRUST_PROXY: ${PUSH_GATEWAY_TRUST_PROXY:-0}
    volumes:
      - "${PUSH_GATEWAY_KEY:?a file holding the gateway's own key (64 hex)}:/run/secrets/gateway-key:ro"
      - gateway-data:/data

volumes:
  gateway-data:
